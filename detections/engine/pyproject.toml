[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-detection-engine"
version = "0.5.0"
description = "Bounded Sigma-subset detection engine for Fusion"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==1.8.0",
  "PyYAML==6.0.3",
]

[project.scripts]
fusion-detection = "fusion_detection.main:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusion_detection*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
