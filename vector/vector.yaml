  normalize_security:
    type: remap
    inputs:
      - ingest_routes.security
    drop_on_abort: true
    reroute_dropped: true
    source: |-
      original = .
      if length(encode_json(original)) > 1048576 { abort }
      payload = object!(.event)

      vendor = to_string(.vendor || "generic") ?? "generic"
      product = to_string(.product || "generic") ?? "generic"
      source_kind = to_string(.source_type || "generic_json") ?? "generic_json"
      platform = to_string(.platform || "network") ?? "network"
      host_name = to_string(.host_name || .device_name || .sensor_name || payload.host || "unknown") ?? "unknown"
      device_name = to_string(.device_name || host_name) ?? host_name
      source_address = to_string(.fusion_transport_source || "") ?? ""
      validation_id = to_string(."X-Fusion-Validation-Id" || ."x-fusion-validation-id" || .validation_id || "") ?? ""

      source_time_raw = payload.timestamp || payload."@timestamp" || .timestamp || ."@timestamp"
      source_time_text = to_string(source_time_raw) ?? ""
      event_time = parse_timestamp(source_time_text, format: "%+") ?? now()
      eve_type = downcase(to_string(payload.event_type) ?? to_string(.event_type) ?? "event")
      is_suricata = downcase(product) == "suricata" || source_kind == "suricata_eve"

      event_category = to_string(.event_category || payload.event_category || "other") ?? "other"
      event_action = to_string(.event_action || payload.event_action || eve_type) ?? eve_type
      event_kind = to_string(.event_kind || payload.event_kind || "event") ?? "event"
      severity = downcase(to_string(.severity || payload.severity || "info") ?? "info")
      outcome = downcase(to_string(.outcome || payload.outcome || "unknown") ?? "unknown")

      source_ip = to_string(payload.src_ip || payload.source_ip || payload.source.ip || "") ?? ""
      source_port = to_int(payload.src_port || payload.source_port || payload.source.port || 0) ?? 0
      destination_ip = to_string(payload.dest_ip || payload.destination_ip || payload.destination.ip || "") ?? ""
      destination_port = to_int(payload.dest_port || payload.destination_port || payload.destination.port || 0) ?? 0
      protocol = downcase(to_string(payload.proto || payload.protocol || payload.network.transport || "") ?? "")
      network_direction = downcase(to_string(.network_direction || payload.direction || "") ?? "")
      signature = to_string(payload.alert.signature || payload.signature || "") ?? ""
      signature_id = to_string(payload.alert.signature_id || payload.signature_id || "") ?? ""
      rule_id = to_string(payload.rule_id || signature_id) ?? signature_id
      domain = to_string(payload.dns.rrname || payload.dns.query.rrname || payload.dns.queries[0].rrname || payload.dns.answers[0].rrname || payload.http.hostname || payload.tls.sni || payload.domain || "") ?? ""
      url = to_string(payload.url || "") ?? ""
      http_path = to_string(payload.http.url || "") ?? ""
      if url == "" && http_path != "" {
        http_host = to_string(payload.http.hostname) ?? ""
        url = if http_host != "" { "http://" + http_host + http_path } else { http_path }
      }
      message = to_string(payload.message || signature) ?? signature
      source_event_id = to_string(payload.flow_id || payload.id || "") ?? ""
      event_code = to_string(payload.event_type || payload.event_code || eve_type) ?? eve_type

      if is_suricata {
        vendor = if vendor == "generic" { "OISF" } else { vendor }
        product = "Suricata"
        source_kind = "suricata_eve"
        platform = "network"
        event_kind = if eve_type == "alert" { "alert" } else { "event" }
        event_category = if eve_type == "alert" { "intrusion_detection" } else if eve_type == "dns" { "dns" } else if eve_type == "http" { "web" } else if eve_type == "tls" || eve_type == "flow" { "network" } else { "other" }
        event_action = if eve_type == "alert" { "network_alert" } else if eve_type == "dns" { "dns_query" } else if eve_type == "http" { "http_request" } else if eve_type == "tls" { "tls_session" } else if eve_type == "flow" { "network_flow" } else { "suricata_event" }
        alert_severity = to_int(payload.alert.severity) ?? 0
        if eve_type == "alert" {
          severity = if alert_severity == 1 { "high" } else if alert_severity == 2 { "medium" } else if alert_severity == 3 { "low" } else { "info" }
          alert_action = downcase(to_string(payload.alert.action) ?? "")
          outcome = if alert_action == "blocked" { "blocked" } else if alert_action == "allowed" { "allowed" } else { "unknown" }
        }
      }

      query_name = if eve_type == "dns" { domain } else { "" }
      query_status = if eve_type == "dns" { to_string(payload.dns.rcode) ?? "" } else { "" }
      query_results = if eve_type == "dns" { encode_json(payload.dns.answers || payload.dns.grouped || []) } else { "" }

      . = {
        "event_time": format_timestamp!(event_time, format: "%Y-%m-%d %H:%M:%S%.3f"),
        "event_id": 0,
        "event_type": event_action,
        "channel": "security_tools",
        "provider_name": product,
        "record_id": 0,
        "computer": host_name,
        "user": "",
        "process_guid": "",
        "process_id": 0,
        "image": "",
        "image_loaded": "",
        "command_line": "",
        "parent_image": "",
        "parent_command_line": "",
        "powershell_script": "",
        "source_ip": source_ip,
        "source_port": source_port,
        "destination_ip": destination_ip,
        "destination_port": destination_port,
        "destination_hostname": domain,
        "query_name": query_name,
        "query_status": query_status,
        "query_results": query_results,
        "target_filename": "",
        "target_object": "",
        "registry_details": "",
        "protocol": protocol,
        "initiated": 0,
        "hashes": "",
        "rule_name": signature,
        "message": message,
        "validation_id": validation_id,
        "raw_json": encode_json(original),
        "host_name": host_name,
        "platform": platform,
        "source_type": source_kind,
        "event_category": event_category,
        "event_action": event_action,
        "event_code": event_code,
        "source_event_id": source_event_id,
        "user_name": "",
        "user_id": "",
        "process_name": "",
        "process_path": "",
        "parent_process_name": "",
        "parent_process_id": 0,
        "service_name": "",
        "outcome": outcome,
        "severity": severity,
        "device_name": device_name,
        "vendor": vendor,
        "product": product,
        "event_kind": event_kind,
        "ingestion_protocol": "http",
        "ingestion_path": "/security",
        "source_address": source_address,
        "original_format": "json",
        "network_direction": network_direction,
        "rule_id": rule_id,
        "signature": signature,
        "signature_id": signature_id,
        "url": url,
        "domain": domain,
        "syslog_facility": "",
        "syslog_application": ""
      }

  tag_syslog_tcp:
    type: remap
    inputs:
      - fusion_syslog_tcp
    source: '.fusion_ingestion_protocol = "syslog_tcp"'

  tag_syslog_udp:
    type: remap
    inputs:
      - fusion_syslog_udp
    source: '.fusion_ingestion_protocol = "syslog_udp"'

  normalize_syslog:
    type: remap
    inputs:
      - tag_syslog_tcp
      - tag_syslog_udp
    drop_on_abort: true
    reroute_dropped: true
    source: |-
      original = .
      message = to_string(.message) ?? ""
      host_name = to_string(.hostname) ?? to_string(.host) ?? "unknown"
      source_address = to_string(.source_ip) ?? ""
      ingestion_protocol = to_string(.fusion_ingestion_protocol) ?? "syslog"
      syslog_application = to_string(.appname) ?? ""
      facility = downcase(to_string(.facility) ?? "")
      severity_raw = downcase(to_string(.severity) ?? "info")
      severity = if severity_raw == "emerg" || severity_raw == "emergency" || severity_raw == "alert" || severity_raw == "crit" || severity_raw == "critical" || severity_raw == "err" || severity_raw == "error" { "error" } else if severity_raw == "warning" || severity_raw == "warn" { "warning" } else if severity_raw == "debug" { "debug" } else { "info" }
      event_time = parse_timestamp(to_string(.timestamp) ?? "", format: "%+") ?? now()
      version = to_int(.version) ?? 0
      original_format = if version == 1 { "rfc5424" } else { "rfc3164" }
      message_id = to_string(.msgid) ?? ""
      syslog_product = if syslog_application != "" { syslog_application } else { "syslog" }
      ingestion_path = if ingestion_protocol == "syslog_tcp" { "tcp/5514" } else { "udp/5514" }

      . = {
        "event_time": format_timestamp!(event_time, format: "%Y-%m-%d %H:%M:%S%.3f"),
        "event_id": 0,
        "event_type": "syslog_message",
        "channel": "syslog",
        "provider_name": syslog_application,
        "record_id": 0,
        "computer": host_name,
        "user": "",
        "process_guid": "",
        "process_id": to_int(.procid) ?? 0,
        "image": "",
        "image_loaded": "",
        "command_line": "",
        "parent_image": "",
        "parent_command_line": "",
        "powershell_script": "",
        "source_ip": "",
        "source_port": 0,
        "destination_ip": "",
        "destination_port": 0,
        "destination_hostname": "",
        "query_name": "",
        "query_status": "",
        "query_results": "",
        "target_filename": "",
        "target_object": "",
        "registry_details": "",
        "protocol": "",
        "initiated": 0,
        "hashes": "",
        "rule_name": "",
        "message": message,
        "validation_id": "",
        "raw_json": encode_json(original),
        "host_name": host_name,
        "platform": "network",
        "source_type": "generic_syslog",
        "event_category": "log",
        "event_action": "syslog_message",
        "event_code": message_id,
        "source_event_id": message_id,
        "user_name": "",
        "user_id": "",
        "process_name": syslog_application,
        "process_path": "",
        "parent_process_name": "",
        "parent_process_id": 0,
        "service_name": syslog_application,
        "outcome": "unknown",
        "severity": severity,
        "device_name": host_name,
        "vendor": "generic",
        "product": syslog_product,
        "event_kind": "event",
        "ingestion_protocol": ingestion_protocol,
        "ingestion_path": ingestion_path,
        "source_address": source_address,
        "original_format": original_format,
        "network_direction": "",
        "rule_id": "",
        "signature": "",
        "signature_id": "",
        "url": "",
        "domain": "",
        "syslog_facility": facility,
        "syslog_application": syslog_application
      }

  rejected_events:
    type: remap
    inputs:
      - normalize_sysmon.dropped
      - normalize_linux.dropped
      - normalize_security.dropped
      - normalize_syslog.dropped
      - ingest_routes._unmatched
    source: |-
      .fusion_error = "normalization_or_path_rejected"

sinks:
  clickhouse:
    type: clickhouse
    inputs:
      - normalize_sysmon
      - normalize_linux
      - normalize_security
      - normalize_syslog
    endpoint: http://clickhouse:8123
    database: fusion
    table: sysmon_events
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: false
    compression: gzip
    batch:
      max_events: 1000
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    request:
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30

  rejected_console:
    type: console
    inputs:
      - rejected_events
    encoding:
      codec: json

tests:
  - name: normalize_nested_sysmon_process_create
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          Event:
            System:
              EventID: 1
              Computer: WORKSTATION-01
            EventData:
              UtcTime: "2026-09-02T10:00:00.123Z"
              Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
              CommandLine: 'powershell.exe -NoProfile -Command Get-Process'
              ProcessId: "4242"
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 1 && .event_type == "process_create" && .process_id == 4242 && contains(to_string(.image) ?? "", "powershell.exe") && .platform == "windows" && .source_type == "windows_sysmon" && .process_name == "powershell.exe" && .process_path == .image'

  - name: normalize_ecs_network_connection
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          "@timestamp": "2026-09-02T10:01:00Z"
          winlog:
            event_id: 3
            event_data:
              DestinationIp: 1.1.1.1
              DestinationPort: "443"
              Protocol: tcp
          host:
            name: WORKSTATION-01
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_type == "network_connect" && .event_category == "network" && .destination_port == 443 && .destination_ip == "1.1.1.1"'

  - name: normalize_windows_agent_process_create
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          source_type: windows_event_log
          timestamp: "2026-09-02T10:02:00.123Z"
          channel: Microsoft-Windows-Sysmon/Operational
          computer: WINDOWS-LAB
          provider_name: Microsoft-Windows-Sysmon
          record_id: 1001
          user_id: S-1-5-21-1000
          event_id: 1
          event_data:
            Image: 'C:\Windows\System32\cmd.exe'
            CommandLine: 'cmd.exe /c whoami'
            ProcessId: "4312"
            ParentProcessId: "4000"
          xml: '<Event><System><EventID>1</EventID></System></Event>'
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 1 && .event_type == "process_create" && .event_time == "2026-09-02 10:02:00.123" && .computer == "WINDOWS-LAB" && .host_name == "WINDOWS-LAB" && .record_id == 1001 && .user_id == "S-1-5-21-1000" && .parent_process_id == 4000 && contains(to_string(.raw_json) ?? "", "windows_event_log") && contains(to_string(.raw_json) ?? "", "xml")'

  - name: normalize_windows_agent_network_connection
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          source_type: windows_event_log
          timestamp: "2026-09-02T10:03:00.123Z"
          channel: Microsoft-Windows-Sysmon/Operational
          computer: WINDOWS-LAB
          event_id: 3
          event_data:
            Image: 'C:\Windows\System32\curl.exe'
            SourceIp: 10.10.10.25
            SourcePort: "51432"
            DestinationIp: 1.1.1.1
            DestinationHostname: one.one.one.one
            DestinationPort: "443"
            Protocol: tcp
            Initiated: "true"
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 3 && .event_type == "network_connect" && .destination_ip == "1.1.1.1" && .destination_port == 443 && .initiated == 1'

  - name: normalize_windows_agent_dns_query
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          source_type: windows_event_log
          timestamp: "2026-09-02T10:04:00.123Z"
          channel: Microsoft-Windows-Sysmon/Operational
          computer: WINDOWS-LAB
          event_id: 22
          event_data:
            Image: 'C:\Windows\System32\nslookup.exe'
            QueryName: example.com
            QueryStatus: "0"
            QueryResults: '93.184.216.34;'
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 22 && .event_type == "dns_query" && .query_name == "example.com" && contains(to_string(.query_results) ?? "", "93.184.216.34")'

  - name: normalize_windows_agent_image_load
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          timestamp: "2026-09-02T10:05:00.123Z"
          event_id: 7
          event_data:
            Image: 'C:\Windows\System32\rundll32.exe'
            ImageLoaded: 'C:\Windows\System32\version.dll'
            Hashes: 'SHA256=example'
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 7 && .event_type == "image_load" && .image_loaded == "C:\\Windows\\System32\\version.dll"'

  - name: normalize_windows_agent_file_create
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          timestamp: "2026-09-02T10:06:00.123Z"
          event_id: 11
          event_data:
            Image: 'C:\Windows\System32\notepad.exe'
            TargetFilename: 'C:\Users\analyst\Documents\lab-note.txt'
    outputs:
      - extract_from: normalize_sysmon
        conditions:
          - type: vrl
            source: '.event_id == 11 && .event_type == "file_create" && contains(to_string(.target_filename) ?? "", "lab-note.txt")'

  - name: normalize_windows_agent_registry_value_set
    inputs:
      - insert_at: normalize_sysmon
        type: log
        log_fields:
          timestamp: "2026-09-02T10:07:00.123Z"
          event_id: 13
