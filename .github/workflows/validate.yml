name: Validate Fusion

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate Vector and run VRL tests
        run: |
          docker compose pull vector
          docker compose run --rm --no-deps vector validate --no-environment /etc/vector/vector.yaml
          docker compose run --rm --no-deps vector test /etc/vector/vector.yaml

      - name: Test Vector sink restart and recovery
        run: ./scripts/test-vector-recovery.sh

      - name: Ensure TCP/UDP syslog test client is available
        run: command -v nc >/dev/null || (sudo apt-get update && sudo apt-get install -y netcat-openbsd)

      - name: Deploy and validate the complete lab
        run: ./scripts/deploy.sh

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop lab
        if: always()
        run: docker compose down --volumes --remove-orphans

  validate-windows-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            [void][scriptblock]::Create([IO.File]::ReadAllText($_.FullName))
          }

      - name: Check PowerShell 7 syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            [void][scriptblock]::Create([IO.File]::ReadAllText($_.FullName))
          }

      - name: Test deployment helpers on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\powershell\test-deployment-compatibility.ps1 -ExpectedRuntime WindowsPowerShell51

      - name: Test deployment helpers on PowerShell 7+
        shell: pwsh
        run: .\tests\powershell\test-deployment-compatibility.ps1 -ExpectedRuntime PowerShell7Plus

      - name: Download and verify Vector 0.58.0 for Windows
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vector-0.58.0-windows.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/vectordotdev/vector/releases/download/v0.58.0/vector-0.58.0-x86_64-pc-windows-msvc.zip' `
            -OutFile $archive
          $expected = '72bbedf4772302f7f67e7db2120fe5b42e39ae65873c895876fc2038050c10c5'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Vector archive checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'vector')

      - name: Validate native Windows agent configuration
        shell: pwsh
        run: |
          $vector = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'vector') -Filter vector.exe -Recurse | Select-Object -First 1
          .\agents\windows\test-config.ps1 -VectorExecutable $vector.FullName

  validate-linux-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Linux agent shell scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          shellcheck -x -e SC1007,SC1091 scripts/lib.sh scripts/deploy.sh scripts/validate.sh
          shellcheck -x scripts/test-vector-recovery.sh
          shellcheck -x scripts/validate-detections.sh
          shellcheck -x scripts/validate-correlations.sh
          for script in agents/linux/*.sh; do sh -n "$script"; done
          shellcheck agents/linux/*.sh
          for script in integrations/suricata/*.sh; do sh -n "$script"; done
          shellcheck integrations/suricata/*.sh

      - name: Download and verify Vector 0.58.0 for Linux
        run: |
          archive="$RUNNER_TEMP/vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            'https://github.com/vectordotdev/vector/releases/download/v0.58.0/vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz'
          printf '%s  %s\n' \
            'a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09' \
            "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/vector-linux"
          tar -xzf "$archive" -C "$RUNNER_TEMP/vector-linux"

      - name: Validate native Linux agent configuration
        run: |
          vector=$(find "$RUNNER_TEMP/vector-linux" -type f -path '*/bin/vector' -print -quit)
          agents/linux/test-config.sh "$vector"

      - name: Validate Suricata EVE integration configuration
        run: |
          vector=$(find "$RUNNER_TEMP/vector-linux" -type f -path '*/bin/vector' -print -quit)
          sh integrations/suricata/test-config.sh "$vector"

      - name: Validate hardened systemd service
        run: |
          unit="$RUNNER_TEMP/fusion-vector-agent.service"
          sed \
            -e 's|^ExecStartPre=.*|ExecStartPre=/bin/true|' \
            -e 's|^ExecStart=.*|ExecStart=/bin/true|' \
            agents/linux/fusion-vector-agent.service > "$unit"
          systemd-analyze verify "$unit"

          suricata_unit="$RUNNER_TEMP/fusion-suricata-vector.service"
          sed \
            -e 's|^ExecStartPre=.*|ExecStartPre=/bin/true|' \
            -e 's|^ExecStart=.*|ExecStart=/bin/true|' \
            integrations/suricata/fusion-suricata-vector.service > "$suricata_unit"
          systemd-analyze verify "$suricata_unit"

  validate-detection-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            detections/engine/requirements.txt
            detections/engine/requirements-dev.txt

      - name: Install detection test dependencies
        run: |
          python -m pip install --requirement detections/engine/requirements-dev.txt
          python -m pip install --no-deps --editable detections/engine

      - name: Run detection unit and security tests
        run: python -m pytest detections/tests

      - name: Validate curated Sigma rules
        run: >-
          fusion-detection validate-rules
          --rules-dir detections/rules
          --mapping detections/mappings/sigma_fields.yml

      - name: Build the hardened detection image
        run: docker compose build fusion-detection-engine

  validate-correlation-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.1.2041-alpine
        env:
          CLICKHOUSE_DB: fusion
          CLICKHOUSE_USER: fusion
          CLICKHOUSE_PASSWORD: correlation-ci-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user fusion --password correlation-ci-only --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            correlation/engine/requirements.txt
            correlation/engine/requirements-dev.txt

      - name: Install correlation test dependencies
        run: |
          python -m pip install --requirement correlation/engine/requirements-dev.txt
          python -m pip install --no-deps --editable correlation/engine

      - name: Apply the ClickHouse schema for live replay tests
        env:
          CLICKHOUSE_CONTAINER_ID: ${{ job.services.clickhouse.id }}
        run: |
          for sql in clickhouse/init/*.sql clickhouse/migrations/*.sql; do
            docker exec -i "$CLICKHOUSE_CONTAINER_ID" clickhouse-client \
              --user fusion --password correlation-ci-only --multiquery < "$sql"
          done

      - name: Run correlation unit, rule, runtime, and dashboard tests
        env:
          FUSION_TEST_CLICKHOUSE: "1"
          FUSION_TEST_CLICKHOUSE_HOST: 127.0.0.1
          FUSION_TEST_CLICKHOUSE_PORT: "8123"
          FUSION_TEST_CLICKHOUSE_USER: fusion
          FUSION_TEST_CLICKHOUSE_PASSWORD: correlation-ci-only
        run: python -m pytest correlation/tests tests/grafana

      - name: Prove correlation integrity state survives ClickHouse restart
        env:
          CLICKHOUSE_CONTAINER_ID: ${{ job.services.clickhouse.id }}
        run: |
          snapshot_query="SELECT (SELECT count() FROM fusion.correlation_detection_input_history), (SELECT sum(cityHash64(tuple(detection_id, detected_at, semantic_fingerprint))) FROM fusion.correlation_detection_input_history), (SELECT count() FROM fusion.correlation_detection_input_witness), (SELECT sum(cityHash64(tuple(detection_id, detected_at, semantic_fingerprint))) FROM fusion.correlation_detection_input_witness), (SELECT count() FROM fusion.correlation_integrity_events), (SELECT uniqExact(integrity_event_id) FROM fusion.correlation_integrity_events), (SELECT count() FROM fusion.correlation_integrity_scope_state_current) FORMAT TSV"
          before=$(docker exec "$CLICKHOUSE_CONTAINER_ID" clickhouse-client \
            --user fusion --password correlation-ci-only --query "$snapshot_query")
          test "$(printf '%s' "$before" | cut -f 5)" -gt 0
          docker restart "$CLICKHOUSE_CONTAINER_ID" >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec "$CLICKHOUSE_CONTAINER_ID" clickhouse-client \
              --user fusion --password correlation-ci-only --query "SELECT 1" \
              >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "ClickHouse did not become ready after restart" >&2
              exit 1
            fi
            sleep 1
          done
          after=$(docker exec "$CLICKHOUSE_CONTAINER_ID" clickhouse-client \
            --user fusion --password correlation-ci-only --query "$snapshot_query")
          test "$after" = "$before"

      - name: Validate exactly four frozen correlation rules
        run: >-
          fusion-correlation validate-rules
          --rules-dir correlation/rules
          --mitre-mapping correlation/mappings/mitre-technique-tactics.yml
          --expected-count 4

      - name: Build the hardened correlation image
        run: docker compose build fusion-correlation-engine
