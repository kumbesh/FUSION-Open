[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-correlation-engine"
version = "0.6.0"
description = "Bounded deterministic correlation and incident engine for Fusion"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==1.8.0",
  "PyYAML==6.0.3",
]

[project.scripts]
fusion-correlation = "fusion_correlation.main:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusion_correlation*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"
